  function renderCategory(containerId, dataArray) {
    const container = document.getElementById(containerId);
    if (!container) return;
    container.innerHTML = '';
    dataArray.forEach((game, idx) => {
      const card = document.createElement('div');
      card.className = 'game-card';
      let servicesHtml = '';
      game.services.forEach(s => {
        servicesHtml += `<li><i class="fas fa-angle-right"></i> ${s}</li>`;
      });
      card.innerHTML = `
        <div class="card-header">
          <div class="game-icon">${game.icon}</div>
          <div class="game-name">${game.name}</div>
        </div>
        <div class="card-body">
          <ul class="service-list">${servicesHtml}</ul>
          <div class="badge"><i class="fas fa-shield-alt"></i> ${game.note}</div>
          <div class="contact-dm"><i class="fas fa-message"></i> DM to order</div>
        </div>
      `;
      container.appendChild(card);
    });
    // After rendering, set up Intersection Observer for new cards
    observeCards();
  }

  // Intersection Observer for scroll twirl animation
  function observeCards() {
    const cards = document.querySelectorAll('.game-card');
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('revealed');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1, rootMargin: '0px 0px 80px 0px' });
    cards.forEach(card => observer.observe(card));
    // if any card already visible before observer (manual fallback)
    cards.forEach(card => {
      const rect = card.getBoundingClientRect();
      if (rect.top < window.innerHeight - 100) card.classList.add('revealed');
    });
  }

  // initial render
  renderCategory('currency-grid', currencyGames);
  renderCategory('accounts-grid', accountsGames);
  renderCategory('topups-grid', topupsGames);
  renderCategory('items-grid', itemsGames);
  renderCategory('boosting-grid', boostingGames);
  renderCategory('giftcards-grid', giftcardsGames);

  // tab switching
  const sections = {
    currency: document.getElementById('currency-section'),
    accounts: document.getElementById('accounts-section'),
    topups: document.getElementById('topups-section'),
    items: document.getElementById('items-section'),
    boosting: document.getElementById('boosting-section'),
    giftcards: document.getElementById('giftcards-section')
  };
  const btns = document.querySelectorAll('.cat-tab');
  function activateTab(catId) {
    Object.values(sections).forEach(sec => sec.classList.remove('active-category'));
    sections[catId].classList.add('active-category');
    btns.forEach(btn => btn.classList.remove('active'));
    const activeBtn = Array.from(btns).find(btn => btn.getAttribute('data-cat') === catId);
    if (activeBtn) activeBtn.classList.add('active');
    // re-observe cards after category change
    setTimeout(observeCards, 100);
  }
  btns.forEach(btn => {
    btn.addEventListener('click', () => {
      const cat = btn.getAttribute('data-cat');
      if (cat && sections[cat]) activateTab(cat);
    });
  });

  // Remove loading overlay after page fully loaded
  window.addEventListener('load', () => {
    const overlay = document.getElementById('loading-overlay');
    if (overlay) {
      overlay.style.opacity = '0';
      setTimeout(() => { overlay.style.visibility = 'hidden'; }, 600);
    }
    observeCards();
  });
