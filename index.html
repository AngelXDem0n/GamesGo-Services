  // Lazy rendering: build only the active category on first load
  const rendered = { currency: false, accounts: false, topups: false, items: false, boosting: false, giftcards: false };

  function renderCategory(categoryId, containerId, data) {
    if (rendered[categoryId]) return;
    const container = document.getElementById(containerId);
    if (!container) return;
    const fragment = document.createDocumentFragment();
    data.forEach(game => {
      const card = document.createElement('div');
      card.className = 'game-card';
      const itemsHtml = game.items.map(item => `<li><i class="fas fa-angle-right"></i> ${item}</li>`).join('');
      card.innerHTML = `
        <div class="card-header">
          <div class="game-icon">${game.icon}</div>
          <div class="game-name">${game.name}</div>
        </div>
        <div class="card-body">
          <ul class="service-list">${itemsHtml}</ul>
          <div class="badge"><i class="fas fa-shield-alt"></i> ${game.note}</div>
          <div class="contact-dm"><i class="fas fa-message"></i> DM to order</div>
        </div>
      `;
      fragment.appendChild(card);
    });
    container.appendChild(fragment);
    rendered[categoryId] = true;
    // trigger scroll animation for new cards
    const cards = container.querySelectorAll('.game-card');
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('revealed');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1, rootMargin: '0px 0px 80px 0px' });
    cards.forEach(card => observer.observe(card));
    // already visible fallback
    cards.forEach(card => {
      if (card.getBoundingClientRect().top < window.innerHeight - 100) card.classList.add('revealed');
    });
  }

  // initial render of currency (active)
  renderCategory('currency', 'currency-grid', gamesData.currency);

  // tab switching with lazy loading
  const sections = {
    currency: document.getElementById('currency-section'),
    accounts: document.getElementById('accounts-section'),
    topups: document.getElementById('topups-section'),
    items: document.getElementById('items-section'),
    boosting: document.getElementById('boosting-section'),
    giftcards: document.getElementById('giftcards-section')
  };
  const btns = document.querySelectorAll('.cat-tab');
  function activateTab(catId) {
    Object.values(sections).forEach(sec => sec.classList.remove('active-category'));
    sections[catId].classList.add('active-category');
    btns.forEach(btn => btn.classList.remove('active'));
    const activeBtn = Array.from(btns).find(btn => btn.getAttribute('data-cat') === catId);
    if (activeBtn) activeBtn.classList.add('active');
    // lazy render if not done yet
    if (catId === 'currency' && !rendered.currency) renderCategory('currency', 'currency-grid', gamesData.currency);
    if (catId === 'accounts' && !rendered.accounts) renderCategory('accounts', 'accounts-grid', gamesData.accounts);
    if (catId === 'topups' && !rendered.topups) renderCategory('topups', 'topups-grid', gamesData.topups);
    if (catId === 'items' && !rendered.items) renderCategory('items', 'items-grid', gamesData.items);
    if (catId === 'boosting' && !rendered.boosting) renderCategory('boosting', 'boosting-grid', gamesData.boosting);
    if (catId === 'giftcards' && !rendered.giftcards) renderCategory('giftcards', 'giftcards-grid', gamesData.giftcards);
  }
  btns.forEach(btn => {
    btn.addEventListener('click', () => {
      const cat = btn.getAttribute('data-cat');
      if (cat && sections[cat]) activateTab(cat);
    });
  });
  // remove loading overlay
  window.addEventListener('load', () => {
    const overlay = document.getElementById('loading-overlay');
    if (overlay) {
      overlay.style.opacity = '0';
      setTimeout(() => { overlay.style.visibility = 'hidden'; }, 600);
    }
  });
</script>
