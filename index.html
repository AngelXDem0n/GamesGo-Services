  // --------------------------------------------------------------
  // RENDER: only active category (lazy loading)
  // --------------------------------------------------------------
  const rendered = { currency: false, accounts: false, topups: false, items: false, boosting: false, giftcards: false };
  function renderCategory(containerId, data) {
    const container = document.getElementById(containerId);
    if (!container) return;
    const fragment = document.createDocumentFragment();
    data.forEach(game => {
      const card = document.createElement('div');
      card.className = 'game-card';
      const itemsHtml = game.items.map(item => `<li><i class="fas fa-angle-right"></i> ${item}</li>`).join('');
      card.innerHTML = `
        <div class="card-header">
          <div class="game-icon">${game.icon}</div>
          <div class="game-name">${game.name}</div>
        </div>
        <div class="card-body">
          <ul class="service-list">${itemsHtml}</ul>
          <div class="badge"><i class="fas fa-shield-alt"></i> ${game.note}</div>
          <div class="contact-dm"><i class="fas fa-message"></i> DM to order</div>
        </div>
      `;
      fragment.appendChild(card);
    });
    container.appendChild(fragment);
    // reveal animation
    const cards = container.querySelectorAll('.game-card');
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('revealed');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1 });
    cards.forEach(card => observer.observe(card));
    cards.forEach(card => {
      if (card.getBoundingClientRect().top < window.innerHeight - 100) card.classList.add('revealed');
    });
  }
  // initial render (currency)
  renderCategory('currency-grid', currencyGames);
  rendered.currency = true;
  // tab switching with lazy load
  const sections = {
    currency: document.getElementById('currency-section'),
    accounts: document.getElementById('accounts-section'),
    topups: document.getElementById('topups-section'),
    items: document.getElementById('items-section'),
    boosting: document.getElementById('boosting-section'),
    giftcards: document.getElementById('giftcards-section')
  };
  const btns = document.querySelectorAll('.cat-tab');
  function activateTab(catId) {
    Object.values(sections).forEach(sec => sec.classList.remove('active-category'));
    sections[catId].classList.add('active-category');
    btns.forEach(btn => btn.classList.remove('active'));
    const activeBtn = Array.from(btns).find(btn => btn.getAttribute('data-cat') === catId);
    if (activeBtn) activeBtn.classList.add('active');
    if (catId === 'accounts' && !rendered.accounts) { renderCategory('accounts-grid', accountsGames); rendered.accounts = true; }
    if (catId === 'topups' && !rendered.topups) { renderCategory('topups-grid', topupsGames); rendered.topups = true; }
    if (catId === 'items' && !rendered.items) { renderCategory('items-grid', itemsGames); rendered.items = true; }
    if (catId === 'boosting' && !rendered.boosting) { renderCategory('boosting-grid', boostingGames); rendered.boosting = true; }
    if (catId === 'giftcards' && !rendered.giftcards) { renderCategory('giftcards-grid', giftcardsGames); rendered.giftcards = true; }
  }
  btns.forEach(btn => {
    btn.addEventListener('click', () => {
      const cat = btn.getAttribute('data-cat');
      if (cat && sections[cat]) activateTab(cat);
    });
  });
  // hide loading overlay
  window.addEventListener('load', () => {
    const overlay = document.getElementById('loading-overlay');
    if (overlay) {
      overlay.style.opacity = '0';
      setTimeout(() => overlay.remove(), 500);
    }
  });
