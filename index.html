    { name: "Steam", icon: "🎮", services: ["Gift cards ($5, $10, $20, $50, $100)"], note: "Digital code" },
    { name: "Xbox", icon: "🕹️", services: ["Gift cards & Game Pass Ultimate"], note: "Instant delivery" },
    { name: "PlayStation", icon: "🎮", services: ["PSN wallet top-up", "Plus subscription"], note: "Global region" },
    { name: "Nintendo eShop", icon: "🎮", services: ["eShop cards (US/EU/JP)"], note: "Code only" },
    { name: "Google Play", icon: "📱", services: ["Google Play codes (mobile games)"], note: "Worldwide" },
    { name: "Apple App Store", icon: "🍎", services: ["iTunes / App Store codes"], note: "Top-up" },
    { name: "Discord Nitro", icon: "💬", services: ["Nitro Basic / Nitro monthly"], note: "Link gift" },
    { name: "Roblox", icon: "🤖", services: ["Roblox eGift cards"], note: "Redeem Robux" },
    { name: "Fortnite", icon: "🔫", services: ["V-Bucks cards"], note: "Digital code" },
    { name: "Razer Gold", icon: "🟢", services: ["Razer Gold PIN codes"], note: "Multi-game top-up" },
    { name: "Netflix", icon: "📺", services: ["Netflix Gift Cards (prepaid)"], note: "Subscription" }
  ];

  function renderCategory(categoryName, containerId, dataArray) {
    const container = document.getElementById(containerId);
    if (!container) return;
    container.innerHTML = '';
    dataArray.forEach((game, idx) => {
      const card = document.createElement('div');
      card.className = 'game-card';
      card.style.animationDelay = `${idx * 0.02}s`;
      let servicesHtml = '';
      game.services.forEach(s => {
        servicesHtml += `<li><i class="fas fa-angle-right"></i> ${s}</li>`;
      });
      card.innerHTML = `
        <div class="card-header">
          <div class="game-icon">${game.icon}</div>
          <div class="game-name">${game.name}</div>
        </div>
        <div class="card-body">
          <ul class="service-list">${servicesHtml}</ul>
          <div class="badge"><i class="fas fa-shield-alt"></i> ${game.note}</div>
          <div class="contact-dm"><i class="fas fa-message"></i> DM to order</div>
        </div>
      `;
      container.appendChild(card);
    });
  }

  // initial render
  renderCategory('Currency', 'currency-grid', currencyGames);
  renderCategory('Accounts', 'accounts-grid', accountsGames);
  renderCategory('Top Ups', 'topups-grid', topupsGames);
  renderCategory('Items', 'items-grid', itemsGames);
  renderCategory('Boosting', 'boosting-grid', boostingGames);
  renderCategory('Gift Cards', 'giftcards-grid', giftcardsGames);

  // tab switching logic
  const sections = {
    currency: document.getElementById('currency-section'),
    accounts: document.getElementById('accounts-section'),
    topups: document.getElementById('topups-section'),
    items: document.getElementById('items-section'),
    boosting: document.getElementById('boosting-section'),
    giftcards: document.getElementById('giftcards-section')
  };
  const buttons = document.querySelectorAll('.cat-tab');
  function activateCategory(categoryId) {
    Object.values(sections).forEach(sec => sec.classList.remove('active-category'));
    sections[categoryId].classList.add('active-category');
    buttons.forEach(btn => btn.classList.remove('active'));
    const activeBtn = Array.from(buttons).find(btn => btn.getAttribute('data-cat') === categoryId);
    if (activeBtn) activeBtn.classList.add('active');
  }
  buttons.forEach(btn => {
    btn.addEventListener('click', (e) => {
      const cat = btn.getAttribute('data-cat');
      if (cat && sections[cat]) activateCategory(cat);
    });
  });
</script>
</body>
</html>
